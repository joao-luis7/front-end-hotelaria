<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Hotelaria</title>

    <!-- Fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Reset de estilos CSS -->
    <link rel="stylesheet" href="infrastructure/assets/css/reset.css">

    <!-- Bootstrap 5.3.8 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Estilos e Layout do Sistema -->
    <link rel="stylesheet" href="infrastructure/assets/css/style.css">
    <link rel="stylesheet" href="infrastructure/assets/css/layout.css">

</head>

<body>

    <div class="container-fluid p-0">
        <div class="d-flex flex-column flex-md-row layout">

            <aside class="sidebar">

                <div class="sidebar-top">
                    <a href="#" class="sidebar-brand">
                        <div class="sidebar-brand-icon">
                            <!-- Ícone da marca / Hotelaria (MUDAR DEPOIS)-->
                            <svg width="19" height="13" viewBox="0 0 19 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1.5 12V1H7.5V12M11.5 12V1H17.5V12M4.5 4H4.51M4.5 7H4.51M4.5 10H4.51M14.5 4H14.51M14.5 7H14.51M14.5 10H14.51" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <h4 class="sidebar-brand-title">Hotelaria</h4>
                    </a>

                    <nav class="w-100">
                        <ul class="sidebar-nav">
                            <li class="sidebar-nav-item">
                                <a href="#" class="sidebar-nav-link active">
                                    <span class="sidebar-nav-icon">
                                        <img src="infrastructure/assets/images/icons/dashboard-icon.svg" width="15" height="15" alt="" aria-hidden="true">
                                    </span>
                                    <span>Painel de Quartos</span>
                                </a>
                            </li>
                            <li class="sidebar-nav-item">
                                <a href="#" class="sidebar-nav-link">
                                    <span class="sidebar-nav-icon">
                                        <img src="infrastructure/assets/images/icons/check-in-icon.svg" width="17" height="14" alt="" aria-hidden="true">
                                    </span>
                                    <span>Check-in</span>
                                </a>
                            </li>
                            <li class="sidebar-nav-item">
                                <a href="#" class="sidebar-nav-link">
                                    <span class="sidebar-nav-icon">
                                        <img src="infrastructure/assets/images/icons/hospedes-icon.svg" width="19" height="14" alt="" aria-hidden="true">
                                    </span>
                                    <span>Hóspedes</span>
                                </a>
                            </li>
                            <li class="sidebar-nav-item">
                                <a href="#" class="sidebar-nav-link">
                                    <span class="sidebar-nav-icon">
                                        <img src="infrastructure/assets/images/icons/pedidos-icon.svg" width="17" height="13" alt="" aria-hidden="true">
                                    </span>
                                    <span>Pedidos</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>

                <div class="sidebar-footer">
                    <div class="sidebar-user-card">
                        <div class="sidebar-user-avatar">RC</div>
                        <div class="sidebar-user-info">
                            <span class="sidebar-user-name">Recepcionista</span>
                            <span class="sidebar-user-role" id="data-atual">10/11/2026</span>
                        </div>
                    </div>
                </div>

            </aside>

            <main class="conteudo">

                <header class="cabecalho">
                    <h2>Bem-vindo ao Sistema de Hotelaria</h2>
                    <p class="mb-0">
                        Gerencie as informações do seu hotel.
                    </p>
                </header>

                <section class="area-conteudo">

                    <h3 class="mb-4">Painel principal</h3>

                    <div class="row g-3">

                        <div class="col-12 col-sm-6 col-xl-4">
                            <div class="card p-3">
                                <h5>Hóspedes</h5>
                                <p class="mb-0">Gerenciamento de hóspedes.</p>
                            </div>
                        </div>

                        <div class="col-12 col-sm-6 col-xl-4">
                            <div class="card p-3">
                                <h5>Quartos</h5>
                                <p class="mb-0">Controle de quartos.</p>
                            </div>
                        </div>

                        <div class="col-12 col-sm-6 col-xl-4">
                            <div class="card p-3">
                                <h5>Reservas</h5>
                                <p class="mb-0">Controle de reservas.</p>
                            </div>
                        </div>

                    </div>

                </section>

            </main>

        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- JavaScript próprio -->
    <script src="infrastructure/assets/js/main.js"></script>

</body>

</html>
