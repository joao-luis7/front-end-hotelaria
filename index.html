<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <title>Sistema de Hotelaria</title>

    <!-- Bootstrap 5.3.8 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

    <div class="container-fluid">
        <div class="row layout">

            <aside class="sidebar col-12 col-md-3 col-lg-2">

                <h4 class="text-white mb-4">
                    Hotelaria
                </h4>

                <nav>
                    <ul>
                        <li><a href="#" class="text-white">Início</a></li>
                        <li><a href="#" class="text-white">Hóspedes</a></li>
                        <li><a href="#" class="text-white">Quartos</a></li>
                        <li><a href="#" class="text-white">Reservas</a></li>
                        <li><a href="#" class="text-white">Relatórios</a></li>
                    </ul>
                </nav>

            </aside>

            <main class="conteudo col-12 col-md-9 col-lg-10">

           
                <header class="cabecalho">
                    <h2>Bem-vindo ao Sistema de Hotelaria</h2>
                    <p class="mb-0">
                        Gerencie as informações do seu hotel.
                    </p>
                </header>

            
                <section class="area-conteudo">

                    <h3 class="mb-4">Painel principal</h3>

                    <div class="row g-3">

                        <div class="col-12 col-sm-6 col-xl-4">
                            <div class="card p-3">
                                <h5>Hóspedes</h5>
                                <p class="mb-0">Gerenciamento de hóspedes.</p>
                            </div>
                        </div>

                        <div class="col-12 col-sm-6 col-xl-4">
                            <div class="card p-3">
                                <h5>Quartos</h5>
                                <p class="mb-0">Controle de quartos.</p>
                            </div>
                        </div>

                        <div class="col-12 col-sm-6 col-xl-4">
                            <div class="card p-3">
                                <h5>Reservas</h5>
                                <p class="mb-0">Controle de reservas.</p>
                            </div>
                        </div>

                    </div>

                </section>

            </main>

        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- JavaScript próprio -->
    <script src="assets/js/main.js"></script>

</body>

</html>
